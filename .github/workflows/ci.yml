name: Enterprise CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  NODE_ENV: development
  JWT_SECRET: dev-secret-at-least-32-characters-long-manaratak-key-phrase
  SESSION_SECRET: dev-session-secret-at-least-32-chars-long
  CSRF_SECRET: dev-csrf-secret-at-least-32-chars-long
  REDIS_URL: redis://localhost:6379
  CORS_ORIGIN: http://localhost:3000
  ADMIN_AUTH_MODE: strict

jobs:
  source-quality:
    name: Source quality and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate branch naming
        if: github.event_name == 'pull_request'
        run: node scripts/git/validate-branch-name.mjs "${{ github.head_ref }}"
      - name: Validate commit messages
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            git log --format=%s "origin/${{ github.base_ref }}..HEAD" | while IFS= read -r message; do
              node scripts/git/validate-commit-message.mjs "$message"
            done
          else
            node scripts/git/validate-commit-message.mjs "$(git log -1 --format=%s)"
          fi
      - name: Source architecture and accessibility gate
        run: npm run quality:source
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Unit and source integration tests
        run: npm run test:unit

  translation-quality:
    name: Translation quality gates
    runs-on: ubuntu-latest
    env:
      DATABASE_MUTATIONS_ALLOWED: 'false'
      DATABASE_ENVIRONMENT: source
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run source-only translation quality gates
        shell: bash
        run: |
          unset DATABASE_URL
          test -z "${DATABASE_URL+x}"
          npm run translation:ci

  # PostgreSQL integration and browser E2E remain implemented in the repository,
  # but Google Studio owns their disposable-runtime execution after handoff.

  configuration:
    name: Deployment configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        run: docker compose config
