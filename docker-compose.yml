version: '3.8'

services:
  # Relational Database Service (Postgres)
  postgres:
    image: postgres:15-alpine
    container_name: manaratak-postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: manaratak
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d manaratak"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Distributed Cache & Queue Service
  redis:
    image: redis:7-alpine
    container_name: manaratak-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
